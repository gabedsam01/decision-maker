name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check src tests

      - name: Run Mypy Type Check
        run: uv run mypy src

      - name: Run Tests
        run: uv run pytest

      - name: Run JS tests
        run: node --test tests/test_panel_keys.mjs

      - name: Check lockfile
        run: uv lock --check

      - name: Build and smoke the package
        run: |
          uv build
          uvx --from "$(ls dist/*.whl)" decisors --help

  publish:
    name: Publish (PyPI + npm)
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) + npm provenance
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI (Trusted Publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance

      - name: npm publish skipped (no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN secret not set; npm publish skipped. Add a granular token with publish permission to enable."
