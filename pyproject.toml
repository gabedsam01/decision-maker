[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decisors"
version = "0.1.0"
description = "Provider-agnostic System One decisions for AI agents: Laya local by default, Jev via TypeSafe or OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gabriel Sampaio" }]
keywords = ["ai", "agents", "decisions", "laya", "jev", "typesafe", "pi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "laya>=0.3.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
decisors = "decisors.cli:main"

[project.urls]
Repository = "https://github.com/gabedsam01/decision-maker"
Documentation = "https://github.com/gabedsam01/decision-maker#readme"
Issues = "https://github.com/gabedsam01/decision-maker/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decisors = ["integrations/*.js", "integrations/skills/*/*.md", "integrations/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["decisors"]
mypy_path = "src"
